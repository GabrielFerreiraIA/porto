  <circle cx="950" cy="315" r="100" fill="rgba(255,255,255,0.08)"/>
  <!-- Shield icon simplified -->
  <path d="M950 195 L1010 220 L1010 315 Q1010 375 950 400 Q890 375 890 315 L890 220 Z" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
