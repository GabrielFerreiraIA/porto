      <stop offset="0%" style="stop-color:#002a7a"/>
      <stop offset="50%" style="stop-color:#003399"/>
      <stop offset="100%" style="stop-color:#0046c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="60" width="1080" height="510" rx="16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Badge -->
  <rect x="120" y="140" width="240" height="36" rx="18" fill="rgba(255,255,255,0.15)"/>
  <text x="240" y="163" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle" letter-spacing="0.5">Correspondente Autorizado</text>
  <!-- Main title -->
  <text x="120" y="260" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="white">Porto Seguro</text>
  <text x="120" y="340" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="rgba(255,255,255,0.9)">Saúde</text>
  <!-- Subtitle -->
  <text x="120" y="400" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.7)">Cotação gratuita · Atendimento especializado · Elih Seguros</text>
  <!-- CTA pill -->
